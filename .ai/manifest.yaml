# .ai/manifest.yaml - the agent-facing contract for this repo (ai-manifest spec; the
# capability blocks can be added later - unknown/missing fields are ignored by readers).
schema: ai-manifest
schemaVersion: 0.1.0
generatedAt: "2026-08-22"

repo:
  name: systedo-case
  purpose: "An AI workspace for advertising: measures account performance and generates the content that follows from it"

# Which document an agent should trust first, stated once, in the file designed to
# answer it. CLAUDE.md is a two-line shim: an `@AGENTS.md` import and a generated
# context map. Readers that do not resolve `@` imports (and there are several) were
# getting 117 context names and no conventions, with nothing telling them what they
# had missed - so precedence is declared here as well as in prose at the top of
# CLAUDE.md itself.
guidance:
  canonical: AGENTS.md
  # Read in this order. Everything after the canonical file ADDS to it; nothing
  # overrides it. Where two disagree, AGENTS.md wins and the other is the bug.
  order:
    - AGENTS.md
    - CLAUDE.md
    - CONTRIBUTING.md
  files:
    - path: AGENTS.md
      role: canonical
      note: "Conventions, seams, the commands, the tool-permission policy. Its first block is the vendor's - see the marker."
    - path: CLAUDE.md
      role: entry-point
      note: "Claude Code's entry file. Imports AGENTS.md and appends the generated Personas context map; holds no guidance of its own."
    - path: CONTRIBUTING.md
      role: contributor
      note: "The same conventions for a human opening a PR, plus licensing and the CLA."
  # The lookup that happens BEFORE any of the above: task -> document. The files
  # listed here settle which guidance wins; this one settles which of the ADRs,
  # runbooks, contracts and design records answers the task actually at hand,
  # instead of leaving that to a guess at the start of every run.
  taskIndex: docs/task-index.md
  # The standard an automated review applies to a diff before a human sees it.
  review: .github/agent-review-rubric.md
  # What must be green before a change lands, and what keeps that list honest.
  requiredChecks: .github/required-checks.json
  # Drift between the generated parts of the surface above and what was accepted:
  # `npm run agents:surface`, blocking inside `npm run check:ci`.
  surfaceLock: .github/agent-surface.lock.json

# The organization's AI registry - knowledge bundles this repo consumes and the skill
# marketplace it installs from. Unknown fields MUST be ignored by a reader.
registry:
  remote: github:xkazm04/ai-registry
  local: ../ai-registry
knowledge:
  domains: [media-generation, software-engineering]

# Shared skills this project uses, from the registry's skills/ lane. The LINK is machine
# state (gitignored, made by ai-registry/scripts/link-skills.mjs); THIS list is the
# reviewable declaration. A skill not listed here is project-owned and lives in
# .claude/skills/ as a real directory.
skills:
  - architect
  - conform
  - consult
  - explorer
  - i18n-translate
  - onboarding
  - perfect
  - project-populate
  - scan-sweep
  - tiger
  - uat
