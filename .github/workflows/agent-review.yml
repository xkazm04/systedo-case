name: Agent review

# Automated review of the diff, against a rubric versioned in this repository
# (.github/agent-review-rubric.md).
#
# Why: ~97% of commits here are written by an agent and triaged by one person
# weekly. For most of a change's life, CI is the only thing that has read it.
# This restores the symmetry — something reviews every diff, on the diff's own
# schedule rather than the maintainer's.
#
# Two halves, matching the rubric, and now two JOBS, because the halves do not
# deserve the same token:
#
#   mechanical (blocking)  — scripts/agent-review.mjs. Five mechanical invariants
#                        where "a reviewer will probably notice" is not good
#                        enough: a component growing past 200 lines, a route
#                        segment-config opt-out under cacheComponents, a deleted
#                        test with no `Ack:` line, a new runtime dependency with
#                        no `Ack:` line, and a commit subject that narrates the
#                        session instead of naming the change. It also puts
#                        law-file touches, gate
#                        softening and new unmapped files at the top of the job
#                        summary, where the weekly triage starts.
#                        This is the job that can fail, so it is the job that
#                        gets NO secrets and a read-only token.
#
#   judgment (comment) — scripts/agent-review-llm.mjs, only when
#                        ANTHROPIC_API_KEY is configured. Applies Part B of the
#                        rubric and posts one PR comment. It never blocks; a
#                        model's taste should not be able to stop a merge. It is
#                        the only job here that holds `pull-requests: write`, and
#                        it holds nothing else.
#
# `Ack:` is the escape hatch for the two rules that need a human sentence rather
# than a code change. Put `Ack: <why>` in a commit message or the PR body.
#
# WHERE THE VERDICT LANDS. A reviewer that leaves no trail is hard to trust and
# harder to improve, so neither half stops at an exit code:
#
#   • check annotations — Part A runs with `--annotate`, so every finding is
#     attached to the COMMIT and rendered inline on the diff and on a PR's Files
#     view. Annotations outlive the run and stay addressable through the API,
#     which is the whole reason the history report below can exist.
#   • a PR comment, always — Part B posts its own review; when no key is
#     configured it posts Part A's report instead, so a pull request is never left
#     with a bare tick and nothing to read.
#   • an artifact, 90 days — mechanical.md plus mechanical.json (the same verdict,
#     countable). Changes here land by direct push to master and are triaged
#     weekly, so "what did the review say about the commit that shipped on the
#     3rd?" is asked well after the run's logs stop being convenient.
#   • a weekly aggregate — .github/workflows/agent-review-history.yml reads those
#     annotations back and reports which rubric rules have actually been firing.
#     A Part A rule that never fires and one that fires constantly are both
#     questions for the rubric, and neither is visible from inside one red build.
#
# `mechanical` is a REQUIRED check — see .github/required-checks.json, and
# scripts/merge-gate.mjs, which fails `npm run check:ci` if this job is renamed,
# removed, stops running on pull requests, or is softened with
# `continue-on-error`. Renaming the job means updating that file in the same
# commit; that is the point.
#
# But a required status check only bites on a pull request, and this repo lands
# changes by direct push to master (docs/deploy.md § Delivery contract) — on that
# path this workflow's verdict arrives after Vercel has begun the deploy. So the
# same Part A also runs as the last stage of `npm run check:ci`
# (`npm run review:agent:gate`), which `.husky/pre-push` runs before any push that
# updates master: a blocking finding refuses the push. Both wirings are asserted
# by test-unit/delivery-contract.test.mjs, so neither can be removed in silence.
#
# Untrusted input never reaches a shell: every `${{ … }}` in this file lands in
# an `env:` variable, and `scripts/actions-pin.mjs` (rule P5, blocking) fails any
# workflow that interpolates an expression directly into a `run:` body.
#
# And untrusted CODE does not reach the job that holds the trust: `judgment` is
# the only job here with both a secret and a write scope, so before it runs
# anything its WORKING TREE is moved to the BASE revision in full — every tracked
# file checked out from the base, every file the change added removed. The change
# enters that job only as `git diff` output, which is data. It used to restore
# just `scripts/` and the rubric, which left the rest of the change's tree on disk
# next to a job holding ANTHROPIC_API_KEY and `pull-requests: write` — and a tree
# is not inert to `node`: `package.json` alone decides module type and the
# `imports` map for every specifier the reviewer resolves. Restoring the whole
# tree costs one extra command and removes the class rather than the instance.
# `mechanical` needs no such treatment — it holds no secret and a read-only
# token, and it is re-run against master by `.husky/pre-push` on the path this
# repository actually lands changes on.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mechanical:
    name: Rubric review of the diff
    runs-on: ubuntu-latest
    # Least privilege, and deliberately smaller than the workflow default: this
    # job executes scripts out of the checkout, which on a pull request is the
    # contributor's code. It reads a diff and writes a job summary; it has no
    # reason to hold a token that can write anything, and no secrets are exposed
    # to it.
    permissions:
      contents: read
    steps:
      # Full history: the review diffs against the base branch, and a shallow
      # clone has no merge base to diff against.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      # The base to review against: a PR's own base, or the previous tip on a
      # push. Both resolve locally because the checkout above is unshallowed.
      #
      # Every value arrives as an environment variable rather than as text
      # spliced into this script. `github.event.*` is attacker-shaped input on a
      # fork's pull request, and `${{ … }}` inside `run:` is substituted BEFORE
      # the shell parses the line — which is how a branch name becomes a command.
      - name: Resolve base revision
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$PR_BASE" ]; then
            ref="$PR_BASE"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            ref="$BEFORE"
          else
            ref="origin/$DEFAULT_BRANCH"
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: "Capture the PR body (an Ack line may live there)"
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" > pr-body.txt

      # Blocking. Zero-dependency, so no npm ci.
      #
      # `--annotate` is what gives the verdict somewhere to live other than this
      # job's exit code: each finding is emitted as a check annotation, which
      # GitHub attaches to the COMMIT and renders inline on the diff and on a PR's
      # Files view. That is where a finding can be answered, and — unlike a job
      # summary — it is still addressable through the API afterwards, which is what
      # scripts/agent-review-history.mjs reads to say which rubric rules have
      # actually been firing. `--json` is the same verdict in a countable form.
      # Neither changes what blocks: the exit code is still Part A's alone.
      - name: Mechanical review (Part A)
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          node scripts/agent-review.mjs \
            --base "$BASE_REF" \
            --body-file pr-body.txt \
            --out mechanical.md \
            --json mechanical.json \
            --annotate \
            --summary "$GITHUB_STEP_SUMMARY"

      # Part B wants Part A's report as context, and it runs in a different job.
      # `if: always()` because the case where a human most wants the judgment
      # half is the one where the mechanical half went red.
      #
      # It is also the trail. Changes here land by direct push to master and are
      # triaged weekly, so "what did the review say about the commit that shipped
      # on the 3rd?" is a real question asked well after the fact — and a 7-day
      # artifact had usually expired by the time anyone asked. 90 days outlives
      # the triage cycle, which is the point of keeping it at all.
      - name: Hand Part A's report to the judgment job (and keep the trail)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mechanical-review
          path: |
            mechanical.md
            mechanical.json
          if-no-files-found: ignore
          retention-days: 90

  judgment:
    name: Judgment review (comment only)
    runs-on: ubuntu-latest
    needs: mechanical
    if: always()
    # The ONLY write scope in this workflow, on the only job that needs it: the
    # judgment half posts exactly one PR comment. Nothing here can fail the
    # build, so a write token and a build verdict never sit in the same job.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve base revision
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$PR_BASE" ]; then
            ref="$PR_BASE"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            ref="$BEFORE"
          else
            ref="origin/$DEFAULT_BRANCH"
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      # The whole working tree becomes the BASE revision. The change stays
      # reachable as a git OBJECT (the `review-head` ref) and reaches the reviewer
      # only through `git diff`, which is data.
      #
      # This is the only job in the repository that holds a secret
      # (ANTHROPIC_API_KEY) and a write scope (pull-requests: write) at the same
      # time, and the checkout above is the change's own tree. Running
      # scripts/agent-review-llm.mjs out of that tree would let the thing under
      # review choose the program that reads it, with the key already in the
      # environment — and on this repository that is not a hypothetical fork: every
      # branch an agent pushes is same-repo, so the secrets ARE handed out.
      #
      # Restoring only `scripts/` and the rubric — which is what this step used to
      # do — left the rest of the change on disk, and `node` does not treat a tree
      # as inert: the nearest `package.json` decides module type and supplies the
      # `imports` map used to resolve every specifier the reviewer loads, a
      # `node_modules/` sits on the resolution path, and any file the reviewer
      # happens to read is the change's. Checking the base out over everything and
      # removing what the change added costs one more command and closes the class
      # instead of the instance.
      #
      # `--force`/`-ff` because the point is that nothing from the head survives,
      # and `-x` because at this point in the job an ignored file can only have
      # arrived with the change (no npm ci has run). No `continue-on-error`: if
      # this cannot complete, the job stops rather than falling through to the
      # change's own tree. It comments, it never blocks, so a red here costs a
      # comment and not a release.
      #
      # `review-head` is whatever the checkout above resolved — the pushed commit,
      # or a pull request's merge commit — so both halves of the review judge the
      # identical artifact. It is recorded BEFORE the tree moves, and read back
      # from an `env:` binding rather than from `github.event.*`, which is a
      # context a fork writes.
      - name: Move the working tree to the base revision
        id: head
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          head="$(git rev-parse HEAD)"
          git branch --force review-head "$head"
          git checkout --force --detach "$BASE_REF"
          git clean -ffdx
          printf 'ref=%s\n' "$head" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      # After the tree is base, so `git clean` above cannot take the report with it.
      - name: Fetch Part A's report
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: mechanical-review

      # Comment-only, and only with a key. On a fork's pull request GitHub hands
      # out no secrets at all, so this step self-skips there and Part A still ran.
      #
      # `--head` is not optional here: the working tree is the base now, so the
      # reviewer would otherwise diff the base against itself and find nothing to
      # say. It names the ref the step above parked the change on.
      #
      # Without a key it does NOT go silent: Part A's own report is posted as the
      # comment instead. A review whose only trace on a pull request is a red tick
      # is a review a maintainer has to go digging for, and the keyless case (a
      # fork, a clone, a repository whose key has lapsed) is exactly when nobody
      # goes digging. `|| true` because this job never fails a build.
      - name: Judgment review (Part B)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ steps.base.outputs.ref }}
          HEAD_REF: ${{ steps.head.outputs.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not configured for this repository — Part B skipped." \
              >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$PR_NUMBER" ] && [ -s mechanical.md ]; then
              gh pr comment "$PR_NUMBER" --body-file mechanical.md || true
            fi
            exit 0
          fi
          set -- --base "$BASE_REF" \
                 --head "$HEAD_REF" \
                 --mechanical mechanical.md \
                 --summary "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            set -- "$@" --pr "$PR_NUMBER"
          fi
          node scripts/agent-review-llm.mjs "$@"
