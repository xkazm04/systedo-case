name: CI

# Continuous integration. The main job runs `npm run check:ci` — the single
# command that reproduces this gate locally (check = typecheck && lint && build,
# then seed drift guard, unit suite, and the key-free LLM gate check: chokepoint
# coverage + contract goldens). The hash-cached real-model re-prove was retired
# 2026-08-05 (static gate only; prove on demand via `npm run test:llm`). Keep
# ci.yml, the `check:ci` script, and .husky/pre-push (which runs check:ci
# before any push to master — see docs/deploy.md § Delivery contract) pointing
# at each other so the three can never drift. `next build` runs only here and
# in the pre-push gate — so a green local commit can still fail CI on build
# unless you ran `npm run check:ci` yourself.
on:
  push:
  pull_request:

# Least privilege, declared rather than inherited. Unset means the repository
# default, which can be read/write — and every step here is either first-party
# tooling or an action from someone else's repository. Nothing in this workflow
# writes to the repo; the artifact upload uses the runner's own token, not this
# one. Enforced by scripts/actions-pin.mjs (see .github/workflows/sast.yml).
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    env:
      # The format-golden fixtures (test-unit/fixtures/format-golden.json) pin
      # byte-identical output of the Intl formatters, minted in the product's
      # home timezone. CI must render in the same zone or the date goldens
      # drift. Node is pinned to the exact minting version below for the same
      # reason (ICU changes across Node minors).
      TZ: Europe/Prague
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One command = the whole CI gate, runnable locally before pushing, and
      #   ordered CHEAPEST FIRST so a red arrives before the build does:
      #   adr:check → docs:parity (the shared claims in README.md and
      #   docs/README.cs.md still agree) → agents:surface → checkpoint:check →
      #   actions:check (workflow token scope, action pinning, no expression
      #   spliced into a `run:` script) → sast (this repository's own security
      #   rules over src/ — caller identity on every API route, no server env var
      #   in a client module, no SQL by interpolation, no decrypted BYOM key in a
      #   route; the same script sast.yml runs as a required check) →
      #   merge-gate (every check that
      #   .github/required-checks.json says may stop a change still exists, still
      #   runs on PRs, and can still fail) → contract:ledger:check →
      #   context:decay:check → review:agent:gate (Part A of the rubric) →
      #   llm:gate:check (chokepoint coverage + contract goldens + the golden
      #   provenance ledger) → llm:quality:check (the baked scorecard's floor on
      #   the models we actually serve) → llm:budget:check → seed drift guard —
      #   fourteen zero-dependency checks, seconds each — then the slow half:
      #   check (typecheck && lint && build) → unit tests. All deterministic and
      #   key-free — zero model calls; the real-model run is on demand
      #   (npm run test:llm) and weekly (.github/workflows/llm-drift.yml).
      #
      #   Each stage prints the next command when it fails — one table, in
      #   scripts/gate-remedy.mjs; `npm run gates` shows it before anything fires.
      #
      #   review:agent:gate is a no-op HERE and load-bearing on a developer's
      #   machine: this checkout is shallow, so `origin/master` is the pushed
      #   commit and the diff is empty, while agent-review.yml's `mechanical` job
      #   reviews the same diff properly with fetch-depth: 0. The reason it is in
      #   check:ci at all is .husky/pre-push — master ships on push, and that hook
      #   is the only place the rubric can refuse a release rather than comment on
      #   one. See docs/deploy.md § Delivery contract.
      #
      #   AND IT IS TIMED. `check:ci:timed` runs that same chain — the stages are
      #   parsed out of the same `check:ci` entry, so there is still one place the
      #   chain is declared — with a clock on each stage. It stops at the first red
      #   one exactly as `&&` does, prints a per-stage table (with each stage's
      #   share of the total) into this job's summary, and then fails when the
      #   chain has stopped being cheapest-first BY MEASUREMENT: a gate that
      #   finishes in seconds may not run behind one that does not, and a stage the
      #   remedy table calls "seconds" may not measure slower than that. The order
      #   was justified by hand-written `cost:` labels that nothing ever held to a
      #   clock — this is the clock. scripts/gate-timings.mjs.
      - name: Full CI gate, timed (npm run check:ci:timed)
        run: npm run check:ci:timed -- --summary "$GITHUB_STEP_SUMMARY"

      # The measurement outlives the run. "How long is the gate, and which stage
      # dominates it?" is a question about a trend, and a job summary expires with
      # its run. `if: always()` because the timings of a RED run are the ones that
      # answer "why did it take four minutes to tell me?".
      #
      # `continue-on-error` here is evidence-keeping, not a softened gate: the
      # verdict was decided by the step above, and an artifact service hiccup must
      # not turn a required check red. Declared as such in
      # .github/required-checks.json § softenedSteps, which is the only way
      # `npm run merge-gate` lets a required job hold one.
      - name: Keep the per-gate timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: gate-timings
          path: .gate-timings.json
          if-no-files-found: ignore
          retention-days: 90

      # i18n audit — REPORTING rung, deliberately non-blocking.
      #
      # The rung is chosen by measurement, not preference: the audit does not pass
      # today (40 coverage gaps / 42 leftover-source values as of 2026-08-22), so
      # making it blocking would only teach people to skip CI. It runs, it prints,
      # and it exits 0 here. What it DOES enforce is the ratchet inside
      # scripts/i18n-audit.mjs: `--check` fails when a count rises above its
      # baseline. Promote this step to blocking (drop continue-on-error) once the
      # counts have been ratcheted down far enough that a red run is always a real
      # regression rather than pre-existing debt.
      - name: i18n audit (reporting rung, ratcheted)
        continue-on-error: true
        run: npm run i18n:audit:check

      # The stricter TypeScript project — REPORTING rung, and the loop that was
      # missing.
      #
      # `tsconfig.strict.json` turns on the two flags `strict: true` does not
      # (noUncheckedIndexedAccess, exactOptionalPropertyTypes) and `npm run
      # typecheck:strict` runs it. Nothing ran it. A second standard nothing executes
      # gives no feedback to the author of a change: the frontier could only move when
      # somebody remembered to look, and the number ADR-0007 says a promotion decision
      # needs was never produced. This step produces it — the count, the files it
      # clusters in, and the rules that fire — into this job's summary on every push
      # and pull request.
      #
      # `continue-on-error` for the same reason as the audit above: the count is not
      # zero today, and a check blocks only once somebody has measured that it passes.
      # `.github/typecheck-strict.json` carries no accepted baseline yet, so the script
      # exits 0 by design; the first `npm run typecheck:strict:accept -- --reason "…"`
      # pins it and a change that makes the frontier worse starts failing here.
      - name: Stricter typecheck (reporting rung, unbaselined)
        continue-on-error: true
        run: npm run typecheck:strict:check -- --summary "$GITHUB_STEP_SUMMARY"

  # Key-free E2E smoke lane. Runs the Playwright suite with NO GEMINI_API_KEY:
  # the two keyed specs (ai-asistent, kampane-triage's model bits) skip their
  # live-model tests and keep structural + demo-mode + timeout coverage; the
  # other three specs (clanek-anchors, dashboard-comparison, design-system) are
  # fully key-free. This is the only layer that catches whole-page runtime
  # regressions (broken anchors, hydration errors, demo fallbacks) that tsc,
  # unit tests and next build all miss. The suite is serial (workers: 1) and one
  # spec deliberately waits out the 60 s client timeout — budget ~5-6 min.
  e2e-smoke:
    name: E2E smoke (Playwright, key-free)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite (model specs self-skip without a key)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
