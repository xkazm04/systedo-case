name: SAST

# Static application security analysis. Two halves, deliberately:
#
#   • repo-rules / workflow-policy  → BLOCKING. Zero-dependency node scripts that
#     encode THIS repo's invariants (scripts/sast.mjs, scripts/actions-pin.mjs).
#     They pass on the tree today, so red means this change introduced it
#     (rung discipline: docs/adr/0007-gate-rung-discipline.md). They need no
#     `npm ci` — that is why they can also run in a pre-commit hook and inside
#     the container image.
#
#   • semgrep                       → REPORTING. Semgrep's registry packs know the
#     generic JavaScript/Node vulnerability classes that a repo-local rule set
#     never will. They also carry a third party's false-positive rate on a 1000-file
#     tree, which is exactly the thing that gets a gate switched off. It runs, it
#     writes a job summary, it uploads SARIF as an artifact, and it exits 0.
#     Promote it to blocking once a clean run is the steady state.
#
# Why this exists at all: SECURITY.md states the stake — a vulnerability here means
# someone spending an advertiser's budget — and until now ESLint was the only static
# analysis in the pipeline. SECURITY.md's "Automated guardrails we run" section is
# kept in sync with this file.
on:
  push:
  pull_request:
  schedule:
    # Weekly, so a newly published Semgrep rule surfaces without waiting for a push.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  repo-rules:
    name: Repo security rules (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      # Zero-dependency: no npm ci. Every finding is either fixed or written down,
      # with a reason, in .github/security/sast-allowlist.json.
      #
      # BLOCKING since 2026-09-01. It was `continue-on-error` before that, for a
      # stated and temporary reason — the scanner arrived with pre-existing
      # findings it had not caused, and landing it blocking would have turned CI
      # red on a tree nobody had changed. The reason expired without the state
      # changing: SECURITY.md, AGENTS.md and .github/constraint-map.json all
      # described this rule as blocking while this line meant nothing in this
      # repository could go red for a security finding at all. The four findings
      # were closed in the same change that deleted the line:
      #
      #   src/lib/campaigns/store/local-docs.ts  ×2  sql-template-interpolation
      #                       fixed — the eight statements those two reads used to
      #                       assemble are now enumerated as complete constants
      #   src/lib/projects/orphan-walk.local.ts      sql-template-interpolation
      #                       allowlisted with a reason (a table name out of
      #                       sqlite_master cannot be bound), and the ceiling that
      #                       pays for it raised in .github/contract-ledger.json
      #   src/app/api/byom/keys/route.ts             plaintext-key-in-route
      #                       fixed — the probe moved behind a lib seam, so NO
      #                       route imports the decrypted key now and that rule's
      #                       ceiling went from 1 to 0
      #
      # The same script is also an early stage of `npm run check:ci`, which
      # .husky/pre-push runs: on this repository's real landing path (direct push
      # to master, Vercel ships on push) a required status check never gets a
      # chance, so the push is where a security finding has to be refused.
      - name: Repo security rules
        run: node scripts/sast.mjs --summary "$GITHUB_STEP_SUMMARY"

  workflow-policy:
    name: Actions supply-chain policy (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      # Every workflow must declare its token scope; no privileged trigger — the
      # family that starts a job in the BASE repository's context, holding its
      # token and its secrets, on an event somebody who cannot push here controls,
      # enumerated once in scripts/actions-pin.mjs under P2 and asserted from the
      # other side by test-unit/workflow-triggers.test.mjs; no
      # action tracking a moving branch; third-party actions pinned to a SHA;
      # container images pinned by digest; and no attacker-shaped context
      # anywhere in a workflow — not in a `run:` script, not in a `with:` input,
      # not in an `if:`, and not in an `env:` binding either. Substitution
      # happens before any shell or action sees the line, which is how a fork's
      # branch name or a PR title becomes code in a job holding this
      # repository's advertiser tokens; and a binding fixes that shape while
      # leaving the value in the environment of every program the step runs. The
      # event payload is read from `$GITHUB_EVENT_PATH` instead
      # (scripts/workflow-event.mjs). Also runs
      # inside `npm run check:ci`, so the pre-push hook catches it before master
      # ships (docs/deploy.md).
      - name: Actions policy
        run: node scripts/actions-pin.mjs --summary "$GITHUB_STEP_SUMMARY"

  semgrep:
    name: Semgrep registry packs (reporting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The CLI from PyPI rather than the Semgrep action: the action follows a
      # moving major and wants an app token for its cloud platform, and this job
      # is meant to be a local scan with no account behind it.
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Scan (registry packs)
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/nodejs \
            --config p/secrets \
            --metrics=off \
            --sarif --output semgrep.sarif \
            src scripts || true
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/nodejs \
            --config p/secrets \
            --metrics=off \
            src scripts > semgrep.txt 2>&1 || true
          {
            echo "### Semgrep (reporting rung)"
            echo
            echo '```'
            tail -c 60000 semgrep.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 30
